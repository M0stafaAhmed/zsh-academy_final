soft link","ln -s /usr/bin/python3 python"],["chmod","Change permissions","chmod 755 script.zsh"],["chown","Change ownership","chown user:group file"]]}},{heading:"Reading Files",table:{headers:["Command","Use case"],rows:[["cat file","Dump entire file to stdout"],["less file","Paginate large files (q to quit)"],["head -n 20 f","First 20 lines"],["tail -n 20 f","Last 20 lines"],["tail -f f","Follow live log output"],["wc -l file","Count lines"]]}},{heading:"Getting Help",table:{headers:["Command","What you get"],rows:[["man ls","Full manual page"],["ls --help","Quick flag reference"],["type ls","Is it a builtin, alias, or binary?"],["which ls","Absolute path of binary"],["whence -v ls","Zsh-native: full origin report"]]},tip:"In Zsh, `whence -v` is more informative than both `which` and `type`. Use it when debugging why a command behaves unexpectedly."}]}},{id:"pipes-redirects",title:"Pipes, Redirects & I/O",description:"stdin, stdout, stderr, pipes, tee, and process substitution.",level:1,branch:"foundation",tags:["pipes","io","redirect"],content:{intro:"Unix philosophy: small tools that compose. Pipes and redirects are the glue. Mastering I/O turns commands into pipelines, and pipelines into power.",sections:[{heading:"Standard Streams",table:{headers:["FD","Name","Default"],rows:[["0","stdin","Keyboard"],["1","stdout","Terminal"],["2","stderr","Terminal"]]}},{heading:"Redirection Operators",table:{headers:["Operator","Effect","Example"],rows:[["> file","Overwrite stdout to file","ls > out.txt"],[">> file","Append stdout to file","echo hi >> log.txt"],["2> file","Redirect stderr to file","cmd 2> err.txt"],["2>&1","Redirect stderr → same as stdout","cmd > all.txt 2>&1"],["&> file","Redirect both stdout+stderr","cmd &> all.txt"],["< file","Feed file to stdin","sort < data.txt"],["<< EOF","Heredoc (multiline stdin)","cat << EOF"],['<<< "str"',"Herestring (single string stdin)",'wc -w <<< "hello world"']]}},{heading:"Pipes",body:"The | pipe connects stdout of one command to stdin of the next. Use |& to pipe both stdout and stderr.",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# Classic pipeline","cat /etc/passwd | cut -d: -f1 | sort | uniq","","# Pipe stderr too","gcc main.c |& grep error","","# Count errors in log","grep -c ERROR /var/log/syslog")}},{heading:"Process Substitution",body:"Process substitution <(cmd) makes a command look like a file. Unique to Zsh/Bash.",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# Diff two command outputs without temp files","diff <(ls dir1) <(ls dir2)","","# Tee to multiple consumers","cat big.log > >(grep ERROR > errors.log) > >(grep WARN > warns.log)")},tip:"Process substitution eliminates temp files entirely. No cleanup needed, no race conditions."}]}},{id:"text-tools",title:"Text Processing Tools",description:"grep, sed, awk, cut, sort, uniq — the operator toolkit.",level:1,branch:"foundation",tags:["grep","sed","awk","text","parsing"],content:{intro:"A shell operator without grep, sed, and awk is like a surgeon without scalpels. These tools transform raw text output into structured, actionable data.",sections:[{heading:"grep — Pattern Matching",table:{headers:["Flag","Effect","Example"],rows:[["-i","Case-insensitive","grep -i error log.txt"],["-r","Recursive directory search",'grep -r "TODO" src/'],["-n","Show line numbers",'grep -n "fail" app.log'],["-v","Invert match",'grep -v "^#" config'],["-E","Extended regex (ERE)",'grep -E "err|warn" log'],["-o","Print only matching part",'grep -oE "[0-9.]+" log'],["-c","Count matching lines",'grep -c "404" access.log'],["-l","List matching filenames",'grep -rl "passwd" /etc']]}},{heading:"sed — Stream Editor",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# Substitute first match per line","sed 's/foo/bar/' file","","# Substitute ALL matches per line","sed 's/foo/bar/g' file","","# In-place edit (GNU sed)","sed -i 's/old/new/g' config.txt","","# Delete lines matching pattern","sed '/^#/d' config.txt","","# Print only lines 5-10","sed -n '5,10p' file")}},{heading:"awk — Field Processor",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# Print 2nd field (whitespace-delimited)","awk '{print $2}' file","","# Custom delimiter","awk -F: '{print $1}' /etc/passwd","","# Conditional processing","awk '$3 > 1000 {print $1, $3}' /etc/passwd","","# Sum a column","awk '{sum += $4} END {print sum}' data.txt","","# Print lines matching pattern with line number","awk '/ERROR/ {print NR\": \"$0}' app.log")}},{heading:"cut, sort, uniq",table:{headers:["Command","Usage pattern","Notes"],rows:[["cut -d: -f1","Extract field by delimiter","cut -d, -f1,3 csv"],["sort","Lexicographic sort","sort -n numeric, -r reverse"],["sort -t, -k2n","Sort CSV by field 2 numerically","-t delimiter, -k key spec"],["uniq -c","Count consecutive duplicates","Pipe sort first: sort | uniq -c | sort -rn"],['tr -d "\\r"',"Delete carriage returns","Windows→Unix line endings"]]},tip:"The holy trinity for log analysis: grep PATTERN log | sort | uniq -c | sort -rn — frequency-ranked list of matches."}]}},{id:"variables",title:"Variables & Parameter Expansion",description:"Scalar, integer, arrays, assoc arrays, typeset flags, expansion modifiers.",level:2,branch:"foundation",tags:["variables","parameters","expansion","typeset","arrays"],content:{intro:"Zsh has one of the richest parameter expansion systems in any shell. Variables are not just storage — they are the primary data manipulation layer.",sections:[{heading:"Variable Types & typeset",table:{headers:["Declaration","Type","Example"],rows:[["name=value","Scalar (string)",'greeting="hello world"'],["typeset -i n","Integer","typeset -i count=0; count+=1"],["typeset -r VAR","Readonly","typeset -r MAX=100"],["typeset -x VAR","Exported (env)","typeset -x API_KEY=secret"],["typeset -l VAR","Auto-lowercase",'typeset -l input; input="HELLO" → hello'],["typeset -u VAR","Auto-uppercase",'typeset -u tag; tag="warn" → WARN'],["typeset -a arr","Indexed array","typeset -a hosts=(a b c)"],["typeset -A map","Associative array","typeset -A ports=([http]=80)"]]}},{heading:"Indexed Arrays (1-indexed in Zsh!)",code:{lang:"zsh",text:((...e)=>e.join("\n"))("hosts=(kali parrot arch)","","# Access","echo $hosts[1]       # kali  (Zsh is 1-indexed!)","echo $hosts[-1]      # arch  (last element)","echo $hosts[1,2]     # kali parrot (slice)","echo ${#hosts}       # 3 (length)","","# Append","hosts+=(ubuntu)","","# Iterate","for h in $hosts; do echo $h; done")}},{heading:"Associative Arrays",code:{lang:"zsh",text:((...e)=>e.join("\n"))("typeset -A ports","ports[http]=80","ports[https]=443","ports[ssh]=22","","echo $ports[http]        # 80","echo ${(k)ports}         # keys: http https ssh","echo ${(v)ports}         # values: 80 443 22","","# Check key existence",'if (( ${+ports[ftp]} )); then echo "ftp key exists"; fi',"","# Iterate key-value pairs","for key val in ${(kv)ports}; do",'  echo "$key → $val"',"done")}},{heading:"Expansion Flags (The Power Layer)",table:{headers:["Flag","Effect","Example"],rows:[["${#var}","Length of string/array","${#mystr}  |  ${#arr}"],["${var:-default}","Use default if unset/empty",'${NAME:-"anonymous"}'],["${var:=default}","Assign default if unset","${LOG:=/tmp/out.log}"],["${var:?msg}","Error and exit if unset",'${TARGET:?"target required"}'],["${var#prefix}","Remove shortest prefix match","${file#*/}"],["${var##prefix}","Remove longest prefix match","${path##*/}  ← basename"],["${var%suffix}","Remove shortest suffix match","${file%.gz}"],["${var%%suffix}","Remove longest suffix match","${url%%/*}  ← protocol"],["${var/old/new}","Replace first match","${str/foo/bar}"],["${var//old/new}","Replace all matches","${str//  / }"],["${(U)var}","Uppercase (Zsh-specific)","${(U)hostname}"],["${(L)var}","Lowercase","${(L)method}"],["${(s:,:)var}","Split on delimiter","${(s:,:)csv_line}"],["${(j: :)arr}","Join array with separator","${(j:,:)hosts}"],["${(o)arr}","Sort array","${(o)targets}"],["${(u)arr}","Unique elements","${(u)ips}"]]},tip:"The (flags) syntax is unique to Zsh. Learn these and you'll rarely need awk for string manipulation."}]}},{id:"conditionals",title:"Conditionals & Tests",description:"`if`, `case`, `[[`, arithmetic tests, file tests, logical operators.",level:2,branch:"foundation",tags:["if","case","test","conditional"],content:{intro:"Zsh's test operators go well beyond POSIX. The [[ compound test is vastly more powerful than [. Know the difference.",sections:[{heading:"[[ vs [ vs test",body:"Always prefer [[ in Zsh scripts. It prevents word-splitting bugs, supports && and || without escaping, supports regex with =~, and has no subprocess overhead.",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# POSIX [ — avoid in Zsh",'[ "$x" = "yes" ] && echo ok',"","# Zsh [[ — preferred",'[[ $x == "yes" ]] && echo ok',"","# [[ supports regex","[[ $ip =~ ^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$ ]] && echo valid","","# [[ supports glob patterns",'[[ $file == *.log ]] && echo "log file"')}},{heading:"File Test Operators",table:{headers:["Operator","True when"],rows:[["-e file","File exists (any type)"],["-f file","Regular file"],["-d file","Directory"],["-L file","Symbolic link"],["-r file","Readable"],["-w file","Writable"],["-x file","Executable"],["-s file","Size > 0 (non-empty file)"],['-z "$var"',"Variable is empty string"],['-n "$var"',"Variable is non-empty"],["f1 -nt f2","f1 is newer than f2"],["f1 -ot f2","f1 is older than f2"]]}},{heading:"Arithmetic Tests",code:{lang:"zsh",text:((...e)=>e.join("\n"))("x=5","","# (( )) — no $ needed, C-style operators",'(( x > 3 )) && echo "greater"','(( x % 2 == 0 )) && echo "even"',"","# [[ for integer comparison",'[[ $x -gt 3 ]] && echo "greater"',"","# Arithmetic assignment","(( count++ ))","(( total += val ))")}},{heading:"case Statement",code:{lang:"zsh",text:((...e)=>e.join("\n"))('case "$action" in',"  start)   systemctl start sshd  ;;","  stop)    systemctl stop sshd   ;;","  restart) systemctl restart sshd;;","  status|stat) systemctl status sshd;;",'  *)       echo "Unknown: $action"; exit 1;;',"esac","","# Zsh fallthrough with ;&",'case "$flag" in',"  -v|--verbose) VERBOSE=1 ;&  # fallthrough","  -d|--debug)   DEBUG=1   ;;","esac")}}]}},{id:"loops",title:"Loops & Iteration",description:"`for`, `while`, `until`, `repeat`, C-style loops, loop control.",level:2,branch:"foundation",tags:["loops","for","while","iteration"],content:{intro:"Loops are the engine of automation. Zsh adds `repeat` and uniquely powerful `for` loop patterns on top of the POSIX set.",sections:[{heading:"for Loop Variants",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# Over array","for host in kali parrot arch; do",'  echo "Scanning $host"',"done","","# Over glob","for f in /var/log/*.log; do",'  wc -l "$f"',"done","","# C-style","for (( i=0; i<10; i++ )); do","  echo $i","done","","# Over file lines (Zsh-safe)",'for line in ${(f)"$(cat hosts.txt)"}; do','  nmap -sV "$line"',"done")}},{heading:"while / until / repeat",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# while: run while condition is true","while [[ -f /tmp/lockfile ]]; do","  sleep 1","done","","# until: run until condition becomes true","until ping -c1 $target &>/dev/null; do",'  echo "Waiting for $target..."',"  sleep 5","done","","# repeat: Zsh-only, run exactly N times",'repeat 3 echo "ping"',"","# Read file line by line safely","while IFS= read -r line; do",'  echo "$line"',"done < targets.txt")}},{heading:"Loop Control",table:{headers:["Keyword","Effect"],rows:[["break","Exit innermost loop"],["break 2","Exit 2 levels of nested loops"],["continue","Skip to next iteration"],["continue 2","Skip to next iteration of outer loop"]]}}]}},{id:"functions",title:"Functions & Scope",description:"Definition, local vars, return values, recursive functions, autoload.",level:3,branch:"engineering",tags:["functions","scope","autoload","local"],content:{intro:"Functions are the primary modularization unit in Zsh scripts. Understanding scope, return values, and autoloading is essential for maintainable tooling.",sections:[{heading:"Definition Syntax",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# Standard form","greet() {",'  echo "Hello, $1"',"}","","# Explicit function keyword","function greet {",'  echo "Hello, $1"',"}","",'greet "world"   # → Hello, world')}},{heading:"Arguments & Return Values",code:{lang:"zsh",text:((...e)=>e.join("\n"))("resolve_host() {",'  local host="$1"',"  local ip",'  ip=$(dig +short "$host" | head -1)',"  if [[ -z $ip ]]; then","    return 1       # failure exit code","  fi",'  echo "$ip"       # "return" a string via stdout',"  return 0","}","","# Capture the returned value","ip=$(resolve_host example.com)","if (( $? == 0 )); then",'  echo "Resolved: $ip"',"fi")}},{heading:"Local Variables & Scope",code:{lang:"zsh",text:((...e)=>e.join("\n"))("x=global","","demo_scope() {","  local x=local",'  echo "Inside: $x"   # → local',"}","","demo_scope",'echo "Outside: $x"    # → global',"","# Local arrays","process_list() {","  local -a items","  items=(a b c)","  echo ${#items}","}")},tip:"Always use `local` for function-internal variables. Without it, your function silently mutates global state — the source of many subtle script bugs."},{heading:"Autoload",body:"Autoloading lets you store each function in its own file and load it on demand. This is the foundation of a professional function library.",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# In .zshrc — add directory to fpath","fpath=(~/.zsh/functions $fpath)","","# Mark functions for autoload","autoload -Uz my_function","","# ~/.zsh/functions/my_function:","# (file contains only the function body — no name declaration needed)",'local target="$1"','echo "Processing $target"')}}]}},{id:"glob-patterns",title:"Globbing & Glob Qualifiers",description:"Extended globs, recursive **, glob qualifiers — Zsh's superpower.",level:3,branch:"engineering",tags:["glob","wildcard","patterns","expansion"],content:{intro:"Zsh globbing is so powerful that many operators requiring `find` in other shells can be done with a glob in Zsh. Glob qualifiers are a unique Zsh capability.",sections:[{heading:"Basic Glob Patterns",table:{headers:["Pattern","Matches","Example"],rows:[["*","Any string (not /)","*.log → all .log files"],["?","Any single char","file?.txt → file1.txt"],["[abc]","One of: a, b, c","[0-9]*.sh"],["[^abc]","Not a, b, or c","[^.]*  (no hidden files)"],["**","Recursive (any depth)","**/  *.conf"]]}},{heading:"Extended Globs (setopt EXTENDED_GLOB)",table:{headers:["Pattern","Matches"],rows:[["*(pattern)","Zero or more of pattern"],["+(pattern)","One or more of pattern"],["?(pattern)","Zero or one of pattern"],["@(a|b)","Exactly one of: a or b"],["!(pattern)","Anything NOT matching pattern"]]},code:{lang:"zsh",text:((...e)=>e.join("\n"))("setopt EXTENDED_GLOB","","# All non-.txt files","ls !(*.txt)","","# Files ending in .log or .err","ls *.@(log|err)")}},{heading:"Glob Qualifiers",body:"Glob qualifiers go inside () at the end of a glob. They filter by file properties without calling find.",table:{headers:["Qualifier","Filter"],rows:[["*(.)","Regular files only"],["*(/)","Directories only"],["*(@)","Symbolic links only"],["*(x)","Executable files"],["*(r)","Readable files"],["*(w)","Writable files"],["*(Lm+1)","Files larger than 1 MB"],["*(mh-1)","Modified in last hour"],["*(om)","Sort by modification time (oldest first)"],["*(Om)","Sort by modification time (newest first)"],["*(^/)","Not directories (^ inverts)"]]},code:{lang:"zsh",text:((...e)=>e.join("\n"))("# All executable files in current dir","print -l *(x.)","","# Log files modified in last 24 hours","ls /var/log/**/*.log(mh-24)","","# 5 largest files","ls -lh *(.OL[1,5])    # OL = reverse sort by size, [1,5] = top 5","","# Empty files","ls *(.L0)")},tip:"Glob qualifiers replace most common `find` invocations. `*(.x)` is faster and more readable than `find . -type f -executable`."}]}},{id:"setopt-options",title:"Shell Options (setopt)",description:"Key Zsh options that change shell behavior — know what's on by default.",level:3,branch:"engineering",tags:["setopt","options","configuration"],content:{intro:"Zsh has over 200 shell options. Knowing the impactful ones changes how you write scripts and interact with the shell day-to-day.",sections:[{heading:"Navigation Options",table:{headers:["Option","Effect"],rows:[["AUTO_CD","Type a dir name to cd into it (no `cd` needed)"],["AUTO_PUSHD","Every cd pushes to directory stack (like pushd)"],["PUSHD_IGNORE_DUPS","Don't push duplicate dirs onto stack"],["CDABLE_VARS","Allow cd to a variable containing a path"]]}},{heading:"Safety Options",table:{headers:["Option","Effect"],rows:[["NO_CLOBBER","Prevent > from overwriting existing files"],["RM_STAR_WAIT","Pause 10 seconds before rm * runs"],["CORRECT","Suggest corrections for mistyped commands"],["CORRECT_ALL","Correct all arguments, not just commands"]]}},{heading:"Scripting Options",table:{headers:["Option","Effect"],rows:[["ERR_EXIT","set -e: exit on first error"],["PIPE_FAIL","Pipe fails if ANY segment fails (not just last)"],["NO_UNSET","Error and exit on unset variable use"],["EXTENDED_GLOB","Enable extended glob patterns (#, ~, ^)"],["NULL_GLOB","No error if glob matches nothing (returns empty)"],["GLOB_DOTS","Glob * includes hidden dot-files"],["LOCAL_OPTIONS","Options set in function are local to it"],["LOCAL_TRAPS","Traps set in function are local to it"]]},code:{lang:"zsh",text:((...e)=>e.join("\n"))("#!/usr/bin/env zsh","","# Recommended script header","setopt ERR_EXIT PIPE_FAIL NO_UNSET","emulate -LR zsh   # reset all options to zsh defaults first")},tip:"Always set ERR_EXIT and PIPE_FAIL in production scripts. The default behavior (ignoring pipeline errors) causes a huge class of silent bugs."}]}},{id:"zle",title:"Zsh Line Editor (ZLE)",description:"Key bindings, custom widgets, vi-mode, prompt editing internals.",level:4,branch:"engineering",tags:["zle","keybindings","vi-mode","editing"],content:{intro:"ZLE is Zsh's built-in line editor — it handles everything you type at the prompt. Understanding ZLE lets you create custom keybindings and editing widgets.",sections:[{heading:"Bindkey Basics",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# View all bindings","bindkey","","# Emacs-style (default)","bindkey -e","","# Vi-style","bindkey -v","","# Edit command in $EDITOR (Ctrl+X Ctrl+E)","autoload -Uz edit-command-line","zle -N edit-command-line","bindkey '^X^E' edit-command-line","","# Ctrl+R → history search","bindkey '^R' history-incremental-search-backward")}},{heading:"Custom ZLE Widgets",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# Widget function","_insert_sudo() {",'  BUFFER="sudo $BUFFER"',"  CURSOR=$(( CURSOR + 5 ))","}","","# Register it","zle -N _insert_sudo","","# Bind it to Alt+S","bindkey '^[s' _insert_sudo")},tip:"ZLE widgets can read and modify $BUFFER (line content) and $CURSOR (position). This makes them extremely powerful for command-line automation."},{heading:"ZLE Special Variables",table:{headers:["Variable","Contains"],rows:[["$BUFFER","Full current command line text"],["$CURSOR","Cursor position (integer)"],["$LBUFFER","Text left of cursor"],["$RBUFFER","Text right of cursor"],["$WIDGET","Name of currently executing widget"],["$LASTWIDGET","Name of previously executed widget"]]}}]}},{id:"completion-system",title:"Completion System (compsys)",description:"compinit, completion styles, custom completion functions.",level:4,branch:"engineering",tags:["completion","compsys","compinit","tab"],content:{intro:"Zsh's completion system (compsys) is the most advanced tab-completion framework in any shell. It is fully programmable and context-aware.",sections:[{heading:"Enabling Completion",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# In .zshrc","autoload -Uz compinit","compinit -d ~/.zcompdump","","# Enable caching for slow completions","zstyle ':completion::complete:*' use-cache on","zstyle ':completion::complete:*' cache-path ~/.zsh/cache")}},{heading:"zstyle Configuration",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# Case-insensitive matching","zstyle ':completion:*' matcher-list 'm:{a-z}={A-Z}'","","# Group results by category","zstyle ':completion:*' group-name ''","zstyle ':completion:*:descriptions' format '%B%d%b'","","# Arrow-key browsable menu","zstyle ':completion:*' menu select","","# Color files in completion using LS_COLORS",'zstyle ":completion:*:default" list-colors ${(s.:.)LS_COLORS}')}},{heading:"Writing a Custom Completion",code:{lang:"zsh",text:((...e)=>e.join("\n"))("#compdef mytool","","_mytool() {","  local -a subcommands","  subcommands=(","    'scan:Run a network scan'","    'report:Generate a report'","    'config:Manage configuration'","  )","","  case $words[2] in","    scan)","      _arguments '-t[target]:target:_hosts' '-p[ports]:ports'","      ;;","    *)",'      _describe "subcommand" subcommands',"      ;;","  esac","}","",'_mytool "$@"')}}]}},{id:"traps-signals",title:"Traps & Signal Handling",description:"trap, EXIT, ERR, INT, TERM — clean shutdown and error hooks.",level:4,branch:"engineering",tags:["trap","signals","exit","error handling"],content:{intro:"Professional scripts handle interruptions gracefully. Traps let you register cleanup code for signals and special pseudo-signals like EXIT and ERR.",sections:[{heading:"Trap Syntax & Common Signals",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# trap 'handler_code' SIGNAL","","# Cleanup on any exit (success or failure)","trap 'rm -f /tmp/scan_$$.tmp' EXIT","","# Handle Ctrl+C (SIGINT)","trap 'echo \"Interrupted\"; exit 130' INT","","# Handle SIGTERM","trap 'echo \"Terminated\"; cleanup; exit 143' TERM","","# Error handler (ERR fires on non-zero exit)","trap 'echo \"Error on line $LINENO\"' ERR")}},{heading:"Practical Cleanup Pattern",code:{lang:"zsh",text:((...e)=>e.join("\n"))("#!/usr/bin/env zsh","setopt ERR_EXIT","","TMPDIR=$(mktemp -d)","LOCKFILE=/var/run/myscript.lock","","cleanup() {",'  rm -rf "$TMPDIR"','  rm -f "$LOCKFILE"','  echo "Cleaned up"',"}","","trap cleanup EXIT INT TERM","","# Your script logic here — cleanup runs no matter what",'touch "$LOCKFILE"')},tip:"Register your cleanup trap at the top of the script, before any code that creates resources. The EXIT trap fires even when ERR_EXIT kills the script."},{heading:"LOCAL_TRAPS in Functions",code:{lang:"zsh",text:((...e)=>e.join("\n"))("setopt LOCAL_TRAPS  # traps in functions are scoped to that function","","risky_op() {","  trap 'echo \"function error at $LINENO\"' ERR","  false  # triggers ERR trap",'  echo "This line is never reached"',"}  # ERR trap is restored to outer scope after function returns")}}]}},{id:"parameter-expansion-advanced",title:"Advanced Parameter Expansion",description:"Nested expansions, ${(flags)}, zparseopts, array operations.",level:4,branch:"engineering",tags:["parameter","expansion","advanced","zparseopts"],content:{intro:"This module goes deep on Zsh-specific parameter expansion capabilities with no equivalent in other shells.",sections:[{heading:"(f) Flag — Split on Newlines",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# Split command output into array, one element per line","typeset -a lines",'lines=( ${(f)"$(cat /etc/hosts)"} )',"","for line in $lines; do","  [[ $line =~ ^[0-9] ]] && echo $line","done","","# Without (f), you get word-split output — usually wrong")}},{heading:"Nested Expansion Operations",code:{lang:"zsh",text:((...e)=>e.join("\n"))("# Array of unique sorted IPs","typeset -a ips","ips=(10.0.0.1 192.168.1.1 10.0.0.1 10.0.0.2)","","# (u) = unique, (o) = sort","echo ${(uo)ips}","","# Join with commas","echo ${(j:,:)${(u)ips}}","","# Uppercase all elements","echo ${(U)ips}")}},{heading:"zparseopts — Professional Argument Parsing",code:{lang:"zsh",text:((...e)=>e.join("\n"))("#!/usr/bin/env zsh","","scan_tool() {","  local -A opts","  local -a targets","","  zparseopts -D -E -A opts \\","    t:=targets \\","    -target:=targets \\","    v=verbose \\","    -verbose=verbose \\","    h=help \\","    -help=help || return 1","","  (( ${+opts[-h]} || ${+opts[--help]} )) && { usage; return 0 }","","  local is_verbose=$(( ${+opts[-v]} || ${+opts[--verbose]} ))","  local target=${targets[-1]}","",'  echo "Target: $target | Verbose: $is_verbose"',"}")},tip:"zparseopts is the professional way to parse flags in Zsh. It handles -s, --long, required args, and leaves remaining positional args in $@."}]}},{id:"recon-wrappers",title:"Recon Wrappers",description:"Wrap nmap, dig, whois, curl into structured Zsh recon scripts.",level:5,branch:"pentest",tags:["recon","nmap","osint","wrapper"],content:{intro:"Raw tool output is noise. Recon wrappers normalize tool output into structured, diffable data that feeds downstream pipeline stages.",sections:[{heading:"Host Discovery Wrapper",code:{lang:"zsh",text:((...e)=>e.join("\n"))("#!/usr/bin/env zsh","setopt ERR_EXIT PIPE_FAIL","",'SWEEP_OUT="${RECON_DIR:-/tmp}/hosts_$(date +%Y%m%d_%H%M%S)"','mkdir -p "$SWEEP_OUT"',"","sweep_range() {",'  local range="$1"','  echo "[*] Sweeping $range"',"","  # ARP scan (Layer 2)",'  nmap -sn -PR "$range" -oG "$SWEEP_OUT/arp.gnmap" 2>/dev/null',"","  # ICMP sweep (Layer 3)",'  nmap -sn -PE "$range" -oG "$SWEEP_OUT/icmp.gnmap" 2>/dev/null',"","  # Parse live hosts",'  grep "Up$" "$SWEEP_OUT"/*.gnmap \\','    | awk "{print \\$2}" \\',"    | sort -u \\",'    > "$SWEEP_OUT/live_hosts.txt"',"",'  echo "[+] Found $(wc -l < "$SWEEP_OUT/live_hosts.txt") hosts"',"}","",'sweep_range "${1:-192.168.1.0/24}"')}},{heading:"DNS Enumeration Pipeline",code:{lang:"zsh",text:((...e)=>e.join("\n"))("#!/usr/bin/env zsh","","dns_enum() {",'  local domain="$1"','  local out_dir="${2:-/tmp/dns_${domain}}"','  mkdir -p "$out_dir"',"","  # Query each record type","  for type in A AAAA MX NS TXT SOA; do",'    dig +noall +answer "$domain" "$type" \\','      > "$out_dir/${type}.txt" 2>/dev/null',"  done","","  # Zone transfer attempt","  local ns",'  ns=$(dig +short "$domain" NS | head -1)',"  if [[ -n $ns ]]; then",'    dig axfr "$domain" @"$ns" > "$out_dir/zone_transfer.txt" 2>&1','    grep -q "Transfer failed" "$out_dir/zone_transfer.txt" \\','      && echo "[-] Zone transfer blocked" \\','      || echo "[+] Zone transfer successful!"',"  fi","}","",'dns_enum "${1:?Usage: $0 <domain>}"')}},{heading:"HTTP Response Fingerprinter",code:{lang:"zsh",text:((...e)=>e.join("\n"))("http_finger() {",'  local target="$1" port="${2:-80}" proto="${3:-http}"','  local url="${proto}://${target}:${port}/"',"","  # Grab full headers","  local headers",'  headers=$(curl -skI --max-time 5 "$url" 2>/dev/null)',"","  # Print interesting headers",'  echo "$headers" | grep -iE "server:|x-powered-by:|x-generator:" | sed "s/^/  /"',"","  # WAF detection",'  local -A waf_sigs=([cloudflare]="CF-Ray" [akamai]="X-Akamai-Edgescape"','                     [sucuri]="X-Sucuri-ID" [incapsula]="X-Iinfo")',"","  for name sig in ${(kv)waf_sigs}; do",'    if echo "$headers" | grep -qi "$sig"; then','      echo "[!] WAF detected: $name"',"    fi","  done","}")}}]}},{id:"port-scan-automation",title:"Port Scan Automation",description:"Multi-stage port scan pipelines, result parsing, service normalization.",level:5,branch:"pentest",tags:["nmap","ports","scanning","automation","pipeline"],content:{intro:"A professional port scan is a staged pipeline: fast sweep → targeted version scan → service-specific scripts. Never run it as a single monolithic command.",sections:[{heading:"Two-Stage Scan Pipeline",code:{lang:"zsh",text:((...e)=>e.join("\n"))("#!/usr/bin/env zsh","",'SCAN_DIR="${PENTEST_DIR:-/tmp}/scans/$(date +%Y%m%d)"','mkdir -p "$SCAN_DIR"',"","staged_scan() {",'  local target="$1"','  local out="$SCAN_DIR/${target//\\//_}"','  mkdir -p "$out"',"",'  echo "[1/3] Fast all-ports scan..."','  nmap -p- --min-rate 5000 -T4 -oG "$out/allports.gnmap" "$target" 2>/dev/null',"","  # Extract open port numbers","  local ports",'  ports=$(grep "Ports:" "$out/allports.gnmap" \\','    | grep -oP "\\d+(?=/open)" \\',"    | sort -n \\",'    | tr "\\n" ","  \\','    | sed "s/,$//")',"",'  [[ -z $ports ]] && { echo "[-] No open ports"; return 1 }',"",'  echo "[2/3] Version detection on: $ports"','  nmap -sV -sC -p "$ports" -oN "$out/services.txt" "$target" 2>/dev/null',"",'  echo "[3/3] Done → $out/services.txt"',"}","",'staged_scan "${1:?Usage: $0 <target>}"')}},{heading:"Bulk Target Scanner with Parallelism",code:{lang:"zsh",text:((...e)=>e.join("\n"))("bulk_scan() {",'  local target_file="$1"','  local max_parallel="${2:-5}"',"  local -a pids","  local count=0","",'  [[ -f $target_file ]] || { echo "No such file: $target_file"; return 1 }',"","  while IFS= read -r target; do",'    [[ -z $target || $target == "#"* ]] && continue',"",'    staged_scan "$target" &',"    pids+=($!)","    (( ++count ))","","    # Limit parallelism — wait every N jobs","    if (( count % max_parallel == 0 )); then",'      wait "${pids[@]}"',"      pids=()",'      echo "[*] Batch of $max_parallel complete"',"    fi",'  done < "$target_file"',"",'  wait "${pids[@]}" 2>/dev/null','  echo "[+] All scans complete"',"}")},tip:"The parallelism limiting pattern (wait every N jobs) prevents flooding the network. Tune max_parallel based on your bandwidth and target environment."}]}},{id:"evidence-collection",title:"Evidence Collection & Reporting",description:"Automated log capture, structured output, report generation.",level:5,branch:"pentest",tags:["evidence","reporting","documentation","logs"],content:{intro:"An engagement is only as good as its documentation. Automated evidence collection ensures nothing gets lost and reports essentially write themselves.",sections:[{heading:"Session Logger",code:{lang:"zsh",text:((...e)=>e.join("\n"))("#!/usr/bin/env zsh","",'ENGAGEMENT="${ENGAGEMENT:-unnamed}"','LOG_ROOT="/engagements/${ENGAGEMENT}/logs"','mkdir -p "$LOG_ROOT"',"",'LOGFILE="$LOG_ROOT/session_$(date +%Y%m%d_%H%M%S).log"',"","start_logging() {",'  echo "[+] Logging to: $LOGFILE"','  exec > >(tee -a "$LOGFILE") 2>&1','  echo "=== Session Start: $(date) ==="','  echo "=== User: $USER | Host: $HOST | Target: ${TARGET:-unset} ==="',"}","","annotate() {",'  echo "\\n### [$(date +%H:%M:%S)] NOTE: $* ###\\n" | tee -a "$LOGFILE"',"}","","alias note=annotate","start_logging")}},{heading:"Markdown Report Generator",code:{lang:"zsh",text:((...e)=>e.join("\n"))("gen_report() {",'  local scan_dir="$1"','  local out="${2:-report.md}"',"","  {",'    echo "# Penetration Test Report"','    echo "**Date:** $(date +%Y-%m-%d)"','    echo "**Operator:** $USER"','    echo ""','    echo "## Hosts Discovered"','    echo "\\`\\`\\`"','    cat "$scan_dir/live_hosts.txt" 2>/dev/null || echo "No hosts file"','    echo "\\`\\`\\`"','    echo ""','    echo "## Open Services"','    echo "\\`\\`\\`"','    find "$scan_dir" -name "services.txt" -exec cat {} \\;','    echo "\\`\\`\\`"','  } > "$out"',"",'  echo "[+] Report written to $out"',"}")}}]}},{id:"toolkit-architecture",title:"Toolkit Architecture",description:"Building a professional pentest toolkit with shared libraries and a dispatcher.",level:6,branch:"pentest",tags:["architecture","library","toolkit","professional"],content:{intro:"A professional toolkit is not a collection of scripts — it is a framework with shared libraries, a dispatch layer, and consistent I/O conventions.",sections:[{heading:"Toolkit Directory Structure",code:{lang:"zsh",text:((...e)=>e.join("\n"))("~/.pentools/","├── bin/","│   └── pt                 # main dispatcher","├── lib/","│   ├── common.zsh         # logging, colors, assert","│   ├── network.zsh        # resolve, ping, port check","│   ├── output.zsh         # json_out, table_out, report_append","│   └── targets.zsh        # load_targets, validate_ip, expand_cidr","├── modules/","│   ├── recon/","│   │   ├── dns.zsh        # dns_enum, zone_transfer","│   │   ├── http.zsh       # http_finger, dir_brute","│   │   └── host.zsh       # host_sweep, os_detect","│   ├── scan/","│   │   ├── ports.zsh      # staged_scan, bulk_scan","│   │   └── vuln.zsh       # nucl -1]:-} ]] && export TARGET="${_target[-1]}"',"","# Dispatch to module",'module="${1:?$(usage; exit 1)}"','command="${2:?$(usage; exit 1)}"',"shift 2","",'mod_file="$TOOLKIT_ROOT/modules/${module}/${command}.zsh"','[[ -f $mod_file ]] || { log_err "Unknown: pt $module $command"; exit 1 }',"",'source "$mod_file"','${command//-/_} "$@"')},tip:"The `${0:A:h:h}` pattern resolves the absolute path and traverses two parent dirs — making the toolkit work correctly from any symlink or cwd."}]}},{id:"zsh-modules",title:"Zsh Modules (zmodload)",description:"zsh/net/tcp, zsh/datetime, zsh/mathfunc, zsh/stat, zsh/zutil.",level:6,branch:"engineering",tags:["zmodload","modules","tcp","datetime","mathfunc"],content:{intro:"Zsh ships with loadable modules that add capabilities normally requiring external tools. Invaluable in constrained environments.",sections:[{heading:"Available Modules",table:{headers:["Module","Adds capability"],rows:[["zsh/net/tcp","Raw TCP socket I/O without netcat"],["zsh/datetime","strftime, high-res timestamps, $EPOCHREALTIME"],["zsh/mathfunc","sin, cos, log, sqrt — math in shell"],["zsh/stat","File stat without calling /usr/bin/stat"],["zsh/zutil","zparseopts, zformat, zregexparse"],["zsh/pcre","Perl-compatible regex (pcre_match)"],["zsh/zpty","Pseudo-terminal control (expect-like)"],["zsh/complist","Colored, menuable completion lists"]]}},{heading:"zsh/net/tcp — TCP Without netcat",code:{lang:"zsh",text:((...e)=>e.join("\n"))("zmodload zsh/net/tcp","","# Open TCP connection","ztcp example.com 80","local fd=$REPLY","","# Send HTTP request",'print -u $fd "GET / HTTP/1.0\\r\\nHost: example.com\\r\\n\\r\\n"',"","# Read response","local line","while IFS= read -r -u $fd line; do",'  echo "$line"',"done","","ztcp -c $fd   # close")},tip:"Invaluable in locked-down environments where netcat, curl, and wget are unavailable. Pure Zsh TCP I/O with no external dependencies."},{heading:"zsh/datetime — High-Resolution Timing",code:{lang:"zsh",text:((...e)=>e.join("\n"))(
